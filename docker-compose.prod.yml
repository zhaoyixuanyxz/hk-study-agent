# Production pilot stack. Copy .env.production.example to .env.production and fill secrets.
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    env_file:
      - .env.production
    environment:
      - PORT=8010
      - NODE_ENV=production
    volumes:
      - app-data:/app/backend/data
    restart: unless-stopped
    networks:
      - appnet

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    networks:
      - appnet

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - appnet

volumes:
  app-data:

networks:
  appnet:
    driver: bridge
